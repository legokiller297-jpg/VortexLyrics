
name: Build VortexLyrics

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir extracted
          ARCHIVE=$(find . -maxdepth 2 -name "*.zip" -print -quit)
          if [ -z "$ARCHIVE" ]; then
            echo "ZIP archive not found"
            exit 1
          fi
          unzip -q "$ARCHIVE" -d extracted
          PROJECT=$(find extracted -name build.gradle -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "build.gradle not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build mod
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon build

      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: VortexLyrics-JAR
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error
          
